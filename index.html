<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>聖隷クリストファー大学 卒業式AR</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family: sans-serif;
    }


    /* ===================================
       カメラ映像
       =================================== */

    #camera {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;

    }


    /* ===================================
       AR表示エリア
       =================================== */

    #arArea {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 2;

      overflow: hidden;

      touch-action: none;

    }


    /* ===================================
       卒業式看板
       =================================== */

    #sign {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 80%;

      max-width: 500px;

      height: auto;

      transform:
        translate(-50%, -50%)
        scale(1);

      transform-origin: center center;

      user-select: none;

      -webkit-user-drag: none;

      pointer-events: auto;

    }


    /* ===================================
       操作説明
       =================================== */

    #help {

      position: fixed;

      top: 10px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      width: calc(100% - 30px);

      max-width: 500px;

      padding: 9px 12px;

      border-radius: 10px;

      background:
        rgba(0, 0, 0, 0.55);

      color: white;

      text-align: center;

      font-size: 13px;

      line-height: 1.5;

    }


    /* ===================================
       操作ボタン
       =================================== */

    #controls {

      position: fixed;

      left: 0;
      bottom: 0;

      width: 100%;

      z-index: 10;

      display: flex;

      justify-content: center;

      gap: 8px;

      padding: 12px;

      background:
        rgba(0, 0, 0, 0.45);

    }


    button {

      border: none;

      border-radius: 10px;

      padding: 10px 13px;

      background: white;

      color: #333;

      font-size: 13px;

      font-weight: bold;

      cursor: pointer;

      white-space: nowrap;

    }


    button:active {

      transform: scale(0.95);

    }


    /* ===================================
       カメラ開始画面
       =================================== */

    #startScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 20;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      background: #000;

      color: white;

      text-align: center;

      padding: 30px;

    }


    #startScreen h1 {

      font-size: 22px;

      margin-bottom: 10px;

    }


    #startScreen p {

      font-size: 14px;

      line-height: 1.7;

      margin-bottom: 25px;

    }


    #startButton {

      padding: 14px 28px;

      font-size: 16px;

    }

  </style>

</head>


<body>


  <!-- ===================================
       カメラ
       =================================== -->

  <video id="camera"
         autoplay
         playsinline>
  </video>


  <!-- ===================================
       AR表示エリア
       =================================== -->

  <div id="arArea">

    <img id="sign"
         src="聖隷クリストファー大学.png"
         alt="聖隷クリストファー大学">

  </div>


  <!-- ===================================
       操作説明
       =================================== -->

  <div id="help">

    👆 1本指：看板を移動　
    🤏 2本指：拡大・縮小

  </div>


  <!-- ===================================
       操作ボタン
       =================================== -->

  <div id="controls">

    <button id="photoButton">
      📸 撮影
    </button>

    <button id="cameraButton">
      🔄 カメラ切替
    </button>

    <button id="resetButton">
      ↺ リセット
    </button>

    <button id="toggleButton">
      看板OFF
    </button>

  </div>


  <!-- ===================================
       カメラ開始画面
       =================================== -->

  <div id="startScreen">

    <h1>
      聖隷クリストファー大学
    </h1>

    <p>
      卒業式ARフォトスポット<br>
      カメラを起動して看板を配置してください。
    </p>

    <button id="startButton">
      📷 カメラを起動
    </button>

  </div>


  <script>


    /* ===================================
       HTML要素
       =================================== */

    const camera =
      document.getElementById("camera");

    const sign =
      document.getElementById("sign");

    const arArea =
      document.getElementById("arArea");

    const photoButton =
      document.getElementById("photoButton");

    const cameraButton =
      document.getElementById("cameraButton");

    const resetButton =
      document.getElementById("resetButton");

    const toggleButton =
      document.getElementById("toggleButton");

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");


    /* ===================================
       看板の状態
       =================================== */

    let posX = 0;

    let posY = 0;

    let scale = 1;

    let signVisible = true;


    /* ===================================
       カメラの状態

       environment = 背面
       user        = 内向き
       =================================== */

    let cameraFacing = "environment";

    let currentStream = null;


    /* ===================================
       タッチ操作用
       =================================== */

    let touchMode = "";

    let startX = 0;

    let startY = 0;

    let startPosX = 0;

    let startPosY = 0;

    let startDistance = 0;

    let startScale = 1;


    /* ===================================
       看板表示更新
       =================================== */

    function updateSign() {

      sign.style.transform =
        "translate(calc(-50% + " +
        posX +
        "px), calc(-50% + " +
        posY +
        "px)) scale(" +
        scale +
        ")";


      sign.style.display =
        signVisible
          ? "block"
          : "none";

    }


    /* ===================================
       2本指の距離
       =================================== */

    function getDistance(
      touch1,
      touch2
    ) {

      const dx =
        touch1.clientX -
        touch2.clientX;

      const dy =
        touch1.clientY -
        touch2.clientY;

      return Math.sqrt(
        dx * dx + dy * dy
      );

    }


    /* ===================================
       タッチ開始
       =================================== */

    arArea.addEventListener(
      "touchstart",
      function(e) {

        if (
          e.touches.length === 1
        ) {

          /* 1本指：移動 */

          touchMode = "move";

          startX =
            e.touches[0].clientX;

          startY =
            e.touches[0].clientY;

          startPosX = posX;

          startPosY = posY;

        }


        else if (
          e.touches.length === 2
        ) {

          /* 2本指：拡大縮小 */

          touchMode = "scale";

          startDistance =
            getDistance(
              e.touches[0],
              e.touches[1]
            );

          startScale = scale;

        }

      },

      {
        passive: false
      }

    );


    /* ===================================
       タッチ移動
       =================================== */

    arArea.addEventListener(
      "touchmove",
      function(e) {

        e.preventDefault();


        /* -----------------------------
           1本指：移動
           ----------------------------- */

        if (
          e.touches.length === 1 &&
          touchMode === "move"
        ) {

          const dx =
            e.touches[0].clientX -
            startX;

          const dy =
            e.touches[0].clientY -
            startY;


          posX =
            startPosX + dx;

          posY =
            startPosY + dy;


          updateSign();

        }


        /* -----------------------------
           2本指：拡大・縮小
           ----------------------------- */

        else if (
          e.touches.length === 2 &&
          touchMode === "scale"
        ) {

          const currentDistance =
            getDistance(
              e.touches[0],
              e.touches[1]
            );


          if (
            startDistance > 0
          ) {

            scale =
              startScale *
              (
                currentDistance /
                startDistance
              );


            /* 最小サイズ */

            scale =
              Math.max(
                0.3,
                scale
              );


            /* 最大サイズ */

            scale =
              Math.min(
                3,
                scale
              );


            updateSign();

          }

        }

      },

      {
        passive: false
      }

    );


    /* ===================================
       タッチ終了
       =================================== */

    arArea.addEventListener(
      "touchend",
      function(e) {

        if (
          e.touches.length === 0
        ) {

          touchMode = "";

        }


        else if (
          e.touches.length === 1
        ) {

          /* 2本指から1本指へ */

          touchMode = "move";


          startX =
            e.touches[0].clientX;

          startY =
            e.touches[0].clientY;


          startPosX = posX;

          startPosY = posY;

        }

      }

    );


    /* ===================================
       リセット
       =================================== */

    resetButton.addEventListener(
      "click",
      function() {

        posX = 0;

        posY = 0;

        scale = 1;

        updateSign();

      }
    );


    /* ===================================
       看板ON / OFF
       =================================== */

    toggleButton.addEventListener(
      "click",
      function() {

        signVisible =
          !signVisible;


        updateSign();


        toggleButton.textContent =
          signVisible
            ? "看板OFF"
            : "看板ON";

      }
    );


    /* ===================================
       カメラ起動
       =================================== */

    async function startCamera() {

      try {

        /* 現在のカメラを停止 */

        if (
          currentStream
        ) {

          currentStream
            .getTracks()
            .forEach(
              track => track.stop()
            );

        }


        /* カメラ取得 */

        currentStream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {

                facingMode: {
                  ideal: cameraFacing
                }

              },

              audio: false

            });


        camera.srcObject =
          currentStream;


        await camera.play();


        /*
         * 内向きカメラの場合も
         * 看板画像は反転させない
         */

        sign.style.transform =
          "translate(calc(-50% + " +
          posX +
          "px), calc(-50% + " +
          posY +
          "px)) scale(" +
          scale +
          ")";


        startScreen.style.display =
          "none";

      }


      catch (error) {

        alert(
          "カメラを起動できませんでした。\n\n" +
          "ブラウザのカメラ使用許可を確認してください。"
        );


        console.error(error);

      }

    }


    /* ===================================
       最初のカメラ起動
       =================================== */

    startButton.addEventListener(
      "click",
      async function() {

        cameraFacing =
          "environment";

        await startCamera();

      }
    );


    /* ===================================
       カメラ切替
       =================================== */

    cameraButton.addEventListener(
      "click",
      async function() {

        /*
         * 背面 ⇔ 内向き
         */

        if (
          cameraFacing === "environment"
        ) {

          cameraFacing = "user";

        }

        else {

          cameraFacing = "environment";

        }


        await startCamera();

      }
    );


    /* ===================================
       撮影
       =================================== */

    photoButton.addEventListener(
      "click",
      function() {

        if (
          !camera.videoWidth ||
          !camera.videoHeight
        ) {

          alert(
            "カメラ映像がまだ準備できていません。"
          );

          return;

        }


        /* Canvas作成 */

        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          camera.videoWidth;

        canvas.height =
          camera.videoHeight;


        const ctx =
          canvas.getContext("2d");


        /* ===================================
           カメラ映像サイズ
           =================================== */

        const videoWidth =
          camera.videoWidth;

        const videoHeight =
          camera.videoHeight;


        const areaWidth =
          arArea.clientWidth;

        const areaHeight =
          arArea.clientHeight;


        const videoRatio =
          videoWidth /
          videoHeight;

        const areaRatio =
          areaWidth /
          areaHeight;


        let drawWidth;

        let drawHeight;

        let offsetX;

        let offsetY;


        /* ===================================
           object-fit: cover
           =================================== */

        if (
          videoRatio > areaRatio
        ) {

          drawHeight =
            areaHeight;

          drawWidth =
            drawHeight *
            videoRatio;


          offsetX =
            (
              areaWidth -
              drawWidth
            ) / 2;


          offsetY = 0;

        }

        else {

          drawWidth =
            areaWidth;

          drawHeight =
            drawWidth /
            videoRatio;


          offsetX = 0;


          offsetY =
            (
              areaHeight -
              drawHeight
            ) / 2;

        }


        /* ===================================
           内向きカメラの場合
           写真も左右反転させる
           
           ※看板は後から描画するため、
             看板文字は反転しない
           =================================== */

        if (
          cameraFacing === "user"
        ) {

          ctx.save();

          ctx.translate(
            canvas.width,
            0
          );

          ctx.scale(
            -1,
            1
          );


          ctx.drawImage(
            camera,
            offsetX *
              (
                canvas.width /
                areaWidth
              ),

            offsetY *
              (
                canvas.height /
                areaHeight
              ),

            drawWidth *
              (
                canvas.width /
                areaWidth
              ),

            drawHeight *
              (
                canvas.height /
                areaHeight
              )
          );


          ctx.restore();

        }

        else {

          /* 背面カメラ */

          ctx.drawImage(
            camera,

            offsetX *
              (
                canvas.width /
                areaWidth
              ),

            offsetY *
              (
                canvas.height /
                areaHeight
              ),

            drawWidth *
              (
                canvas.width /
                areaWidth
              ),

            drawHeight *
              (
                canvas.height /
                areaHeight
              )
          );

        }


        /* ===================================
           看板を描画
           =================================== */

        if (
          signVisible &&
          sign.complete
        ) {

          const rect =
            sign.getBoundingClientRect();


          /* 看板中心 */

          let centerX =
            (
              rect.left +
              rect.width / 2
            ) *
            (
              canvas.width /
              areaWidth
            );


          const centerY =
            (
              rect.top +
              rect.height / 2
            ) *
            (
              canvas.height /
              areaHeight
            );


          /* 看板サイズ */

          const signWidth =
            rect.width *
            (
              canvas.width /
              areaWidth
            );


          const signHeight =
            rect.height *
            (
              canvas.height /
              areaHeight
            );


          /*
           * 内向きカメラの場合、
           * カメラ映像は左右反転しているため、
           * 看板をその上に正しい向きで置く。
           */

          if (
            cameraFacing === "user"
          ) {

            centerX =
              canvas.width -
              centerX;

          }


          /* 看板を描画 */

          ctx.drawImage(
            sign,

            centerX -
              signWidth / 2,

            centerY -
              signHeight / 2,

            signWidth,

            signHeight
          );

        }


        /* ===================================
           写真保存
           =================================== */

        const link =
          document.createElement(
            "a"
          );


        link.download =
          "seirei-graduation-ar.png";


        link.href =
          canvas.toDataURL(
            "image/png"
          );


        link.click();

      }
    );


    /* ===================================
       初期表示
       =================================== */

    updateSign();

  </script>

</body>
</html>
