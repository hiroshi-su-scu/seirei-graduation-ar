<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>聖隷クリストファー大学 卒業式AR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    /* カメラ映像 */
    #camera {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* AR表示エリア */
    #arArea {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    /* 卒業式看板 */
    #sign {
      position: absolute;
      left: 50%;
      top: 50%;

      width: 70vw;
      max-width: 500px;
      height: auto;

      transform: translate(-50%, -50%) scale(1);

      transform-origin: center center;

      pointer-events: auto;
      touch-action: none;

      user-select: none;
      -webkit-user-drag: none;

      z-index: 3;
    }

    /* 操作説明 */
    #help {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 10;

      width: calc(100vw - 30px);
      max-width: 500px;

      padding: 8px 12px;

      background: rgba(0, 0, 0, 0.55);
      color: #fff;

      border-radius: 8px;

      text-align: center;
      font-size: 13px;
      line-height: 1.5;

      pointer-events: none;
    }

    /* ボタンエリア */
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 20;

      width: calc(100vw - 20px);
      max-width: 600px;

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 10px;

      padding: 11px 13px;

      font-size: 14px;
      font-weight: bold;

      background: rgba(255, 255, 255, 0.92);
      color: #222;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.96);
    }

    /* 撮影ボタン */
    #photoButton {
      background: #fff;
      font-size: 16px;
      padding: 12px 18px;
    }

    /* 看板OFF時 */
    .hidden {
      display: none !important;
    }

    /* 撮影時のフラッシュ */
    #flash {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      background: white;

      opacity: 0;

      z-index: 100;

      pointer-events: none;
    }

    #flash.show {
      animation: flashAnimation 0.25s ease-out;
    }

    @keyframes flashAnimation {
      0% {
        opacity: 0.8;
      }

      100% {
        opacity: 0;
      }
    }

    /* カメラ許可待ち */
    #message {
      position: fixed;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 50;

      color: white;

      text-align: center;

      width: 90%;

      font-size: 16px;

      line-height: 1.7;
    }
  </style>
</head>

<body>

  <!-- カメラ -->
  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <!-- AR看板 -->
  <div id="arArea">
    <img
      id="sign"
      src="聖隷クリストファー大学.png"
      alt="聖隷クリストファー大学 卒業式看板">
  </div>

  <!-- 説明 -->
  <div id="help">
    👆 1本指：看板を移動　🤏 2本指：拡大・縮小
  </div>

  <!-- カメラ起動メッセージ -->
  <div id="message">
    カメラを起動しています…<br>
    カメラの使用を許可してください。
  </div>

  <!-- ボタン -->
  <div id="controls">

    <button id="photoButton">
      📷 撮影
    </button>

    <button id="resetButton">
      ↩️ リセット
    </button>

    <button id="toggleButton">
      👁 看板OFF
    </button>

    <button id="cameraButton">
      🔄 カメラ切替
    </button>

  </div>

  <!-- 撮影フラッシュ -->
  <div id="flash"></div>


  <script>

    /* =========================================
       基本設定
    ========================================= */

    const video = document.getElementById("camera");
    const sign = document.getElementById("sign");
    const message = document.getElementById("message");

    const photoButton = document.getElementById("photoButton");
    const resetButton = document.getElementById("resetButton");
    const toggleButton = document.getElementById("toggleButton");
    const cameraButton = document.getElementById("cameraButton");

    const flash = document.getElementById("flash");


    /* =========================================
       カメラ
    ========================================= */

    let cameraFacing = "environment";
    let currentStream = null;


    async function startCamera() {

      try {

        message.style.display = "block";

        /* 以前のカメラを停止 */
        if (currentStream) {

          currentStream.getTracks().forEach(track => {
            track.stop();
          });

        }


        /* カメラ起動 */

        const stream = await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: cameraFacing
            }
          },

          audio: false

        });


        currentStream = stream;

        video.srcObject = stream;

        await video.play();


        message.style.display = "none";


        /* 内側カメラの場合 */
        if (cameraFacing === "user") {

          /*
           * 自撮りカメラは鏡のように表示
           */
          video.style.transform = "scaleX(-1)";

        } else {

          video.style.transform = "scaleX(1)";

        }


      } catch (error) {

        console.error(error);

        message.innerHTML =
          "カメラを起動できませんでした。<br><br>" +
          "ブラウザのカメラ使用許可を確認してください。";

      }

    }


    /* =========================================
       カメラ切替
    ========================================= */

    cameraButton.addEventListener("click", function () {

      if (cameraFacing === "environment") {

        cameraFacing = "user";

      } else {

        cameraFacing = "environment";

      }

      startCamera();

    });


    /* =========================================
       看板位置・サイズ
    ========================================= */

    let signX = window.innerWidth / 2;
    let signY = window.innerHeight / 2;

    let signScale = 1;


    function updateSign() {

      sign.style.left = signX + "px";
      sign.style.top = signY + "px";

      sign.style.transform =
        "translate(-50%, -50%) scale(" + signScale + ")";

    }


    /* 初期表示 */
    updateSign();


    /* =========================================
       看板ON / OFF
    ========================================= */

    let signVisible = true;


    toggleButton.addEventListener("click", function () {

      signVisible = !signVisible;

      if (signVisible) {

        sign.classList.remove("hidden");

        toggleButton.textContent = "👁 看板OFF";

      } else {

        sign.classList.add("hidden");

        toggleButton.textContent = "👁 看板ON";

      }

    });


    /* =========================================
       リセット
    ========================================= */

    resetButton.addEventListener("click", function () {

      signX = window.innerWidth / 2;
      signY = window.innerHeight / 2;

      signScale = 1;

      updateSign();

    });


    /* =========================================
       看板移動・拡大縮小
    ========================================= */

    let dragging = false;

    let startX = 0;
    let startY = 0;

    let startSignX = 0;
    let startSignY = 0;

    let startDistance = 0;
    let startScale = 1;


    /* -----------------------------------------
       2点間の距離
    ----------------------------------------- */

    function getDistance(touch1, touch2) {

      const dx = touch2.clientX - touch1.clientX;
      const dy = touch2.clientY - touch1.clientY;

      return Math.sqrt(
        dx * dx + dy * dy
      );

    }


    /* -----------------------------------------
       タッチ開始
    ----------------------------------------- */

    sign.addEventListener("touchstart", function (event) {

      event.preventDefault();


      /* 1本指 */
      if (event.touches.length === 1) {

        dragging = true;

        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;

        startSignX = signX;
        startSignY = signY;

      }


      /* 2本指 */
      if (event.touches.length === 2) {

        dragging = false;

        startDistance =
          getDistance(
            event.touches[0],
            event.touches[1]
          );

        startScale = signScale;

      }

    }, { passive: false });


    /* -----------------------------------------
       タッチ移動
    ----------------------------------------- */

    sign.addEventListener("touchmove", function (event) {

      event.preventDefault();


      /* 1本指：移動 */

      if (
        event.touches.length === 1 &&
        dragging
      ) {

        const dx =
          event.touches[0].clientX - startX;

        const dy =
          event.touches[0].clientY - startY;


        signX = startSignX + dx;
        signY = startSignY + dy;


        updateSign();

      }


      /* 2本指：拡大・縮小 */

      if (event.touches.length === 2) {

        const currentDistance =
          getDistance(
            event.touches[0],
            event.touches[1]
          );


        if (startDistance > 0) {

          const ratio =
            currentDistance / startDistance;


          signScale =
            startScale * ratio;


          /* 小さくなりすぎないようにする */

          if (signScale < 0.3) {
            signScale = 0.3;
          }


          /* 大きくなりすぎないようにする */

          if (signScale > 4) {
            signScale = 4;
          }


          updateSign();

        }

      }

    }, { passive: false });


    /* -----------------------------------------
       タッチ終了
    ----------------------------------------- */

    sign.addEventListener("touchend", function (event) {

      if (event.touches.length === 0) {

        dragging = false;

      }

    }, { passive: false });


    /* =========================================
       撮影
    ========================================= */

    photoButton.addEventListener("click", function () {

      if (!video.videoWidth || !video.videoHeight) {

        alert("カメラの準備ができていません。");

        return;

      }


      /* 撮影フラッシュ */

      flash.classList.remove("show");

      /*
       * アニメーションを再実行するため
       */
      void flash.offsetWidth;

      flash.classList.add("show");


      /* -----------------------------------------
         Canvas作成
      ----------------------------------------- */

      const canvas =
        document.createElement("canvas");


      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;


      const ctx = canvas.getContext("2d");


      /* -----------------------------------------
         カメラ映像をCanvasへ描画
         object-fit: cover に合わせる
      ----------------------------------------- */

      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      const canvasWidth = canvas.width;
      const canvasHeight = canvas.height;


      const videoRatio =
        videoWidth / videoHeight;

      const canvasRatio =
        canvasWidth / canvasHeight;


      let sx = 0;
      let sy = 0;
      let sw = videoWidth;
      let sh = videoHeight;


      if (videoRatio > canvasRatio) {

        /*
         * 左右を切り取る
         */

        sw = videoHeight * canvasRatio;

        sx = (videoWidth - sw) / 2;

      } else {

        /*
         * 上下を切り取る
         */

        sh = videoWidth / canvasRatio;

        sy = (videoHeight - sh) / 2;

      }


      /* -----------------------------------------
         内側カメラの場合は左右反転
      ----------------------------------------- */

      if (cameraFacing === "user") {

        ctx.save();

        ctx.translate(canvas.width, 0);

        ctx.scale(-1, 1);

        ctx.drawImage(
          video,
          sx,
          sy,
          sw,
          sh,
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.restore();

      } else {

        ctx.drawImage(
          video,
          sx,
          sy,
          sw,
          sh,
          0,
          0,
          canvas.width,
          canvas.height
        );

      }


      /* -----------------------------------------
         看板を合成
      ----------------------------------------- */

      if (signVisible) {

        const image =
          new Image();

        image.src =
          sign.src;


        image.onload = function () {

          drawSignAndSave(
            canvas,
            ctx,
            image
          );

        };

      } else {

        saveCanvas(canvas);

      }

    });


    /* =========================================
       看板をCanvasに描画
    ========================================= */

    function drawSignAndSave(
      canvas,
      ctx,
      image
    ) {

      /*
       * 画面上の座標を
       * カメラ画像の座標へ変換
       */

      const scaleX =
        canvas.width / window.innerWidth;

      const scaleY =
        canvas.height / window.innerHeight;


      let drawX =
        signX * scaleX;

      let drawY =
        signY * scaleY;


      /*
       * 内側カメラでは
       * 背景が左右反転しているため
       * 看板の位置だけ左右反転する。
       *
       * 看板そのものは反転させない。
       */

      if (cameraFacing === "user") {

        drawX =
          canvas.width - drawX;

      }


      /*
       * PNGの表示サイズ
       */

      const screenWidth =
        sign.offsetWidth * signScale;

      const screenHeight =
        sign.offsetHeight * signScale;


      const drawWidth =
        screenWidth * scaleX;

      const drawHeight =
        screenHeight * scaleY;


      /*
       * 中心位置から左上位置を計算
       */

      const x =
        drawX - drawWidth / 2;

      const y =
        drawY - drawHeight / 2;


      /*
       * PNGを描画
       */

      ctx.drawImage(
        image,
        x,
        y,
        drawWidth,
        drawHeight
      );


      /* 保存 */

      saveCanvas(canvas);

    }


    /* =========================================
       Canvasを保存
    ========================================= */

    function saveCanvas(canvas) {

      /*
       * 現在日時からファイル名を作る
       *
       * 例：
       * seirei-graduation-ar-20260929-160530.png
       */

      const now = new Date();


      const year =
        now.getFullYear();

      const month =
        String(now.getMonth() + 1)
          .padStart(2, "0");

      const day =
        String(now.getDate())
          .padStart(2, "0");

      const hour =
        String(now.getHours())
          .padStart(2, "0");

      const minute =
        String(now.getMinutes())
          .padStart(2, "0");

      const second =
        String(now.getSeconds())
          .padStart(2, "0");


      const fileName =
        `seirei-graduation-ar-${year}${month}${day}-${hour}${minute}${second}.png`;


      /*
       * PNGデータを作成
       */

      canvas.toBlob(function (blob) {

        if (!blob) {

          alert("写真の作成に失敗しました。");

          return;

        }


        /*
         * ダウンロード
         */

        const url =
          URL.createObjectURL(blob);


        const link =
          document.createElement("a");


        link.href = url;

        link.download = fileName;


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


        /*
         * 一時URLを解放
         */

        setTimeout(function () {

          URL.revokeObjectURL(url);

        }, 1000);


      }, "image/png");

    }


    /* =========================================
       画面サイズ変更時
    ========================================= */

    window.addEventListener("resize", function () {

      /*
       * 看板が画面外に飛び出しにくいように
       * 必要に応じて位置を調整
       */

      if (signX > window.innerWidth) {

        signX = window.innerWidth / 2;

      }

      if (signY > window.innerHeight) {

        signY = window.innerHeight / 2;

      }

      updateSign();

    });


    /* =========================================
       起動
    ========================================= */

    startCamera();

  </script>

</body>
</html>
