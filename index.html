<!DOCTYPE html>

<html lang="ja"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>聖隷クリストファー大学 卒業式AR</title>

<style> * { box-sizing: border-box; } html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; } /* カメラ映像 */ #camera { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; } /* AR画面 */ #ar-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; } /* 卒業式看板 */ #sign { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 500px; padding: 20px 10px; text-align: center; background: rgba(255, 255, 255, 0.92); border: 5px solid #333; border-radius: 8px; color: #222; font-size: 28px; font-weight: bold; box-shadow: 0 5px 20px rgba(0,0,0,0.4); } #sign .university { font-size: 18px; margin-bottom: 12px; } #sign .title { font-size: 38px; letter-spacing: 0.15em; } /* 開始ボタン */ #start { position: fixed; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 18px 35px; border: none; border-radius: 10px; background: #ffffff; color: #222; font-size: 20px; font-weight: bold; } #message { position: fixed; z-index: 11; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; padding: 10px; text-align: center; color: white; background: rgba(0,0,0,0.6); border-radius: 8px; font-size: 14px; } </style>

</head>

<body>

<!-- カメラ -->

<video id="camera" autoplay playsinline></video>

<!-- AR表示 -->

<div id="ar-screen">

<div id="sign">
  <div class="university">
    聖隷クリストファー大学
  </div>

  <div class="title">
    卒業式
  </div>
</div>

</div>

<!-- 開始ボタン -->

<button id="start"> 📷 ARを開始 </button>

<div id="message"> カメラを起動すると卒業式の看板が表示されます </div>

<script> const camera = document.getElementById("camera"); const start = document.getElementById("start"); const message = document.getElementById("message"); start.addEventListener("click", async () => { try { const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false }); camera.srcObject = stream; start.style.display = "none"; message.textContent = "卒業式の看板を表示しています"; } catch (error) { console.error(error); message.textContent = "カメラを起動できませんでした。カメラの使用を許可してください。"; } }); </script>

</body> </html>
