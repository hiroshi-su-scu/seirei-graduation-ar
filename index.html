<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聖隷クリストファー大学 卒業式ARプロトタイプ</title>
<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#111;color:#fff}
#ui{position:fixed;z-index:10;left:0;right:0;top:0;padding:18px 16px;text-align:center;background:linear-gradient(#000b,transparent);pointer-events:none}
#ui h1{font-size:18px;margin:0 0 7px;font-weight:700}
#status{font-size:14px;opacity:.9}
#error{display:none;position:fixed;z-index:20;left:12px;right:12px;bottom:20px;padding:14px;border-radius:12px;background:#fff;color:#222;font-size:14px}
</style>
</head>
<body>
<div id="ui"><h1>聖隷クリストファー大学 ARプロトタイプ</h1><div id="status">カメラを起動しています…</div></div>
<div id="error"></div>
<div class="example-container" style="position:absolute;width:100%;height:100%;overflow:hidden">
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets>
    <img id="universityLogo" src="./聖隷クリストファー大学.png" crossorigin="anonymous">
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane src="#universityLogo" position="0 0.45 0.05" width="0.9" height="0.166" transparent="true"></a-plane>
    <a-text value="Hello Seirei!" align="center" color="#ffffff" width="2.2" position="0 0.05 0.06" font="https://cdn.aframe.io/fonts/Roboto-msdf.json" shader="msdf"></a-text>
    <a-text value="🎓  卒業おめでとう！" align="center" color="#ffffff" width="1.8" position="0 -0.25 0.06"></a-text>
    <a-ring color="#ffffff" radius-inner="0.52" radius-outer="0.54" position="0 0 0.04" animation="property: rotation; to: 0 0 360; dur: 6000; loop: true; easing: linear"></a-ring>
  </a-entity>
</a-scene>
</div>
<script>
const scene=document.querySelector('a-scene');
const status=document.getElementById('status');
const err=document.getElementById('error');
scene.addEventListener('arReady',()=>status.textContent='マーカーをカメラに映してください');
scene.addEventListener('targetFound',()=>status.textContent='🎉 ARを認識しました！');
scene.addEventListener('targetLost',()=>status.textContent='マーカーをカメラに映してください');
scene.addEventListener('arError',()=>{err.style.display='block';err.textContent='ARを起動できませんでした。HTTPS接続とカメラ許可を確認してください。';});
</script>
</body>
</html>
