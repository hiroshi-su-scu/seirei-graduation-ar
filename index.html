<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>聖隷クリストファー大学 卒業式AR</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family: sans-serif;

    }


    /* ========================================
       カメラ
       ======================================== */

    #camera {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      background: #000;

      z-index: 1;

    }


    /* ========================================
       AR表示エリア
       ======================================== */

    #arArea {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      z-index: 2;

      pointer-events: none;

      overflow: hidden;

    }


    /* ========================================
       卒業式看板
       ======================================== */

    #sign {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 70vw;

      max-width: 500px;

      height: auto;

      transform:
        translate(-50%, -50%)
        scale(1);

      transform-origin: center center;

      pointer-events: auto;

      touch-action: none;

      user-select: none;

      -webkit-user-drag: none;

      z-index: 3;

    }


    /* ========================================
       説明
       ======================================== */

    #help {

      position: fixed;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      width: calc(100vw - 30px);

      max-width: 500px;

      padding: 8px 12px;

      background:
        rgba(0, 0, 0, 0.55);

      color: #fff;

      border-radius: 8px;

      text-align: center;

      font-size: 13px;

      line-height: 1.5;

      pointer-events: none;

    }


    /* ========================================
       ボタンエリア
       ======================================== */

    #controls {

      position: fixed;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      width: calc(100vw - 12px);

      max-width: 650px;

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 7px;

    }


    button {

      border: none;

      border-radius: 10px;

      padding: 10px 11px;

      font-size: 13px;

      font-weight: bold;

      background:
        rgba(255, 255, 255, 0.92);

      color: #222;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.25);

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

    }


    button:active {

      transform: scale(0.96);

    }


    button:disabled {

      opacity: 0.45;

    }


    /* 撮影ボタン */

    #photoButton {

      background: #fff;

      font-size: 16px;

      padding: 11px 16px;

    }


    /* ズーム表示 */

    #zoomValue {

      min-width: 58px;

      padding-left: 10px;

      padding-right: 10px;

      background:
        rgba(0, 0, 0, 0.70);

      color: white;

      box-shadow: none;

    }


    /* ========================================
       看板OFF
       ======================================== */

    .hidden {

      display: none !important;

    }


    /* ========================================
       撮影フラッシュ
       ======================================== */

    #flash {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      background: white;

      opacity: 0;

      z-index: 100;

      pointer-events: none;

    }


    #flash.show {

      animation:
        flashAnimation 0.25s ease-out;

    }


    @keyframes flashAnimation {

      0% {
        opacity: 0.8;
      }

      100% {
        opacity: 0;
      }

    }


    /* ========================================
       カメラ起動メッセージ
       ======================================== */

    #message {

      position: fixed;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      z-index: 50;

      color: white;

      text-align: center;

      width: 90%;

      font-size: 16px;

      line-height: 1.7;

    }

  </style>

</head>


<body>


  <!-- ========================================
       カメラ
       ======================================== -->

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>


  <!-- ========================================
       AR看板
       ======================================== -->

  <div id="arArea">

    <img
      id="sign"
      src="聖隷クリストファー大学.png"
      alt="聖隷クリストファー大学 卒業式看板">

  </div>


  <!-- ========================================
       操作説明
       ======================================== -->

  <div id="help">

    👆 1本指：看板を移動　
    🤏 2本指：看板を拡大・縮小

  </div>


  <!-- ========================================
       カメラ起動メッセージ
       ======================================== -->

  <div id="message">

    カメラを起動しています…<br>

    カメラの使用を許可してください。

  </div>


  <!-- ========================================
       操作ボタン
       ======================================== -->

  <div id="controls">


    <button id="photoButton">
      📷 撮影
    </button>


    <button id="zoomOutButton">
      🔍 −
    </button>


    <button id="zoomValue">
      1.0×
    </button>


    <button id="zoomInButton">
      ＋
    </button>


    <button id="resetButton">
      ↩️ リセット
    </button>


    <button id="toggleButton">
      👁 看板OFF
    </button>


    <button id="cameraButton">
      🔄 カメラ切替
    </button>


  </div>


  <!-- ========================================
       撮影フラッシュ
       ======================================== -->

  <div id="flash"></div>


  <script>


    /* ========================================
       基本設定
       ======================================== */

    const video =
      document.getElementById("camera");

    const sign =
      document.getElementById("sign");

    const message =
      document.getElementById("message");

    const photoButton =
      document.getElementById("photoButton");

    const zoomOutButton =
      document.getElementById("zoomOutButton");

    const zoomInButton =
      document.getElementById("zoomInButton");

    const zoomValue =
      document.getElementById("zoomValue");

    const resetButton =
      document.getElementById("resetButton");

    const toggleButton =
      document.getElementById("toggleButton");

    const cameraButton =
      document.getElementById("cameraButton");

    const flash =
      document.getElementById("flash");


    /* ========================================
       カメラ設定
       ======================================== */

    let cameraFacing =
      "environment";

    let currentStream =
      null;

    let currentTrack =
      null;


    /* ========================================
       ズーム設定
       ======================================== */

    let zoomMin = 1;

    let zoomMax = 1;

    let zoomStep = 0.1;

    let currentZoom = 1;


    /* ========================================
       カメラ起動
       ======================================== */

    async function startCamera() {

      try {

        message.style.display =
          "block";


        /*
         * 以前のカメラを停止
         */

        if (currentStream) {

          currentStream
            .getTracks()
            .forEach(
              track => track.stop()
            );

        }


        /*
         * カメラ取得
         */

        const stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {

                facingMode: {
                  ideal: cameraFacing
                }

              },

              audio: false

            });


        currentStream =
          stream;


        currentTrack =
          stream.getVideoTracks()[0];


        video.srcObject =
          stream;


        await video.play();


        message.style.display =
          "none";


        /*
         * 内側カメラは
         * 鏡像表示
         */

        if (
          cameraFacing === "user"
        ) {

          video.style.transform =
            "scaleX(-1)";

        } else {

          video.style.transform =
            "scaleX(1)";

        }


        /*
         * カメラのズーム性能を確認
         */

        setupZoom();


      } catch (error) {

        console.error(error);


        message.innerHTML =
          "カメラを起動できませんでした。<br><br>" +
          "ブラウザのカメラ使用許可を確認してください。";

      }

    }


    /* ========================================
       ズーム機能の確認
       ======================================== */

    function setupZoom() {


      if (!currentTrack) {

        disableZoom();

        return;

      }


      /*
       * カメラが対応している機能を取得
       */

      const capabilities =
        currentTrack.getCapabilities
          ? currentTrack.getCapabilities()
          : null;


      /*
       * ズーム非対応
       */

      if (
        !capabilities ||
        !("zoom" in capabilities)
      ) {

        zoomMin = 1;
        zoomMax = 1;

        currentZoom = 1;

        updateZoomDisplay();

        disableZoom();

        return;

      }


      /*
       * ズーム範囲
       */

      zoomMin =
        capabilities.zoom.min;


      zoomMax =
        capabilities.zoom.max;


      /*
       * カメラによっては
       * stepがかなり細かい場合がある。
       */

      if (
        capabilities.zoom.step
      ) {

        zoomStep =
          capabilities.zoom.step;

      } else {

        zoomStep = 0.1;

      }


      /*
       * 初期値
       */

      currentZoom =
        Math.max(
          zoomMin,
          Math.min(
            1,
            zoomMax
          )
        );


      updateZoomDisplay();


      /*
       * 1倍しかない場合
       */

      if (
        zoomMax <= zoomMin
      ) {

        disableZoom();

      } else {

        enableZoom();

      }

    }


    /* ========================================
       ズーム無効
       ======================================== */

    function disableZoom() {

      zoomOutButton.disabled =
        true;

      zoomInButton.disabled =
        true;

      zoomValue.textContent =
        "ズーム非対応";

    }


    /* ========================================
       ズーム有効
       ======================================== */

    function enableZoom() {

      zoomOutButton.disabled =
        false;

      zoomInButton.disabled =
        false;

      updateZoomDisplay();

    }


    /* ========================================
       ズーム表示
       ======================================== */

    function updateZoomDisplay() {

      if (
        zoomMax <= zoomMin
      ) {

        zoomValue.textContent =
          "1.0×";

        return;

      }


      zoomValue.textContent =
        currentZoom.toFixed(1) +
        "×";

    }


    /* ========================================
       実際のカメラズーム変更
       ======================================== */

    async function applyZoom(
      newZoom
    ) {

      if (!currentTrack) {

        return;

      }


      /*
       * 値を範囲内に収める
       */

      newZoom =
        Math.max(
          zoomMin,
          Math.min(
            zoomMax,
            newZoom
          )
        );


      /*
       * stepに合わせる
       */

      if (zoomStep > 0) {

        newZoom =
          Math.round(
            newZoom /
            zoomStep
          ) *
          zoomStep;

      }


      newZoom =
        Math.max(
          zoomMin,
          Math.min(
            zoomMax,
            newZoom
          )
        );


      try {

        await currentTrack.applyConstraints({

          advanced: [
            {
              zoom: newZoom
            }
          ]

        });


        currentZoom =
          newZoom;


        updateZoomDisplay();


      } catch (error) {

        console.error(
          "ズーム変更エラー:",
          error
        );

      }

    }


    /* ========================================
       ズーム＋
       ======================================== */

    zoomInButton.addEventListener(
      "click",
      function () {

        applyZoom(
          currentZoom +
          zoomStep
        );

      }
    );


    /* ========================================
       ズーム－
       ======================================== */

    zoomOutButton.addEventListener(
      "click",
      function () {

        applyZoom(
          currentZoom -
          zoomStep
        );

      }
    );


    /* ========================================
       カメラ切替
       ======================================== */

    cameraButton.addEventListener(
      "click",
      function () {


        if (
          cameraFacing ===
          "environment"
        ) {

          cameraFacing =
            "user";

        } else {

          cameraFacing =
            "environment";

        }


        startCamera();

      }
    );


    /* ========================================
       看板位置・サイズ
       ======================================== */

    let signX =
      window.innerWidth / 2;

    let signY =
      window.innerHeight / 2;

    let signScale = 1;


    function updateSign() {

      sign.style.left =
        signX + "px";

      sign.style.top =
        signY + "px";


      sign.style.transform =
        "translate(-50%, -50%) " +
        "scale(" +
        signScale +
        ")";

    }


    updateSign();


    /* ========================================
       看板ON / OFF
       ======================================== */

    let signVisible =
      true;


    toggleButton.addEventListener(
      "click",
      function () {


        signVisible =
          !signVisible;


        if (signVisible) {

          sign.classList.remove(
            "hidden"
          );

          toggleButton.textContent =
            "👁 看板OFF";

        } else {

          sign.classList.add(
            "hidden"
          );

          toggleButton.textContent =
            "👁 看板ON";

        }

      }
    );


    /* ========================================
       リセット
       ======================================== */

    resetButton.addEventListener(
      "click",
      function () {


        /*
         * 看板をリセット
         */

        signX =
          window.innerWidth / 2;

        signY =
          window.innerHeight / 2;

        signScale =
          1;

        updateSign();


        /*
         * カメラズームも1倍へ
         */

        if (
          zoomMax > zoomMin
        ) {

          applyZoom(1);

        }

      }
    );


    /* ========================================
       タッチ操作
       ======================================== */

    let dragging =
      false;

    let startX = 0;

    let startY = 0;

    let startSignX = 0;

    let startSignY = 0;

    let startDistance = 0;

    let startScale = 1;


    /* ----------------------------------------
       2点間距離
       ---------------------------------------- */

    function getDistance(
      touch1,
      touch2
    ) {

      const dx =
        touch2.clientX -
        touch1.clientX;

      const dy =
        touch2.clientY -
        touch1.clientY;


      return Math.sqrt(
        dx * dx +
        dy * dy
      );

    }


    /* ----------------------------------------
       タッチ開始
       ---------------------------------------- */

    sign.addEventListener(
      "touchstart",
      function (event) {


        event.preventDefault();


        /*
         * 1本指
         */

        if (
          event.touches.length === 1
        ) {

          dragging =
            true;


          startX =
            event.touches[0].clientX;

          startY =
            event.touches[0].clientY;


          startSignX =
            signX;

          startSignY =
            signY;

        }


        /*
         * 2本指
         */

        if (
          event.touches.length === 2
        ) {

          dragging =
            false;


          startDistance =
            getDistance(
              event.touches[0],
              event.touches[1]
            );


          startScale =
            signScale;

        }

      },
      {
        passive: false
      }
    );


    /* ----------------------------------------
       タッチ移動
       ---------------------------------------- */

    sign.addEventListener(
      "touchmove",
      function (event) {


        event.preventDefault();


        /*
         * 1本指：移動
         */

        if (
          event.touches.length === 1 &&
          dragging
        ) {

          const dx =
            event.touches[0].clientX -
            startX;


          const dy =
            event.touches[0].clientY -
            startY;


          signX =
            startSignX +
            dx;


          signY =
            startSignY +
            dy;


          updateSign();

        }


        /*
         * 2本指：看板拡大縮小
         */

        if (
          event.touches.length === 2
        ) {

          const currentDistance =
            getDistance(
              event.touches[0],
              event.touches[1]
            );


          if (
            startDistance > 0
          ) {

            const ratio =
              currentDistance /
              startDistance;


            signScale =
              startScale *
              ratio;


            /*
             * 最小
             */

            if (
              signScale < 0.3
            ) {

              signScale =
                0.3;

            }


            /*
             * 最大
             */

            if (
              signScale > 4
            ) {

              signScale =
                4;

            }


            updateSign();

          }

        }

      },
      {
        passive: false
      }
    );


    /* ----------------------------------------
       タッチ終了
       ---------------------------------------- */

    sign.addEventListener(
      "touchend",
      function (event) {


        if (
          event.touches.length === 0
        ) {

          dragging =
            false;

        }

      },
      {
        passive: false
      }
    );


    /* ========================================
       撮影
       ======================================== */

    photoButton.addEventListener(
      "click",
      function () {


        if (
          !video.videoWidth ||
          !video.videoHeight
        ) {

          alert(
            "カメラの準備ができていません。"
          );

          return;

        }


        /* ------------------------------------
           フラッシュ
           ------------------------------------ */

        flash.classList.remove(
          "show"
        );


        void flash.offsetWidth;


        flash.classList.add(
          "show"
        );


        /* ====================================
           画面比率
           ==================================== */

        const screenWidth =
          window.innerWidth;

        const screenHeight =
          window.innerHeight;


        const screenRatio =
          screenWidth /
          screenHeight;


        /* ====================================
           カメラ元解像度
           ==================================== */

        const videoWidth =
          video.videoWidth;

        const videoHeight =
          video.videoHeight;


        const videoRatio =
          videoWidth /
          videoHeight;


        /*
         * 画面と同じ比率になるよう
         * 中央部分を切り出す
         */

        let sx = 0;

        let sy = 0;

        let sw =
          videoWidth;

        let sh =
          videoHeight;


        if (
          videoRatio >
          screenRatio
        ) {

          /*
           * 横長
           * 左右を切る
           */

          sw =
            videoHeight *
            screenRatio;


          sx =
            (videoWidth - sw) /
            2;

        } else {

          /*
           * 縦長
           * 上下を切る
           */

          sh =
            videoWidth /
            screenRatio;


          sy =
            (videoHeight - sh) /
            2;

        }


        /* ====================================
           Canvas
           ==================================== */

        const canvas =
          document.createElement(
            "canvas"
          );


        /*
         * 元カメラの解像度を
         * できるだけ維持
         */

        canvas.width =
          Math.round(sw);

        canvas.height =
          Math.round(sh);


        const ctx =
          canvas.getContext("2d");


        /* ====================================
           カメラ映像
           ==================================== */

        if (
          cameraFacing === "user"
        ) {

          /*
           * 内側カメラ
           *
           * 鏡像
           */

          ctx.save();


          ctx.translate(
            canvas.width,
            0
          );


          ctx.scale(
            -1,
            1
          );


          ctx.drawImage(

            video,

            sx,
            sy,
            sw,
            sh,

            0,
            0,
            canvas.width,
            canvas.height

          );


          ctx.restore();


        } else {

          /*
           * 外側カメラ
           */

          ctx.drawImage(

            video,

            sx,
            sy,
            sw,
            sh,

            0,
            0,
            canvas.width,
            canvas.height

          );

        }


        /* ====================================
           看板合成
           ==================================== */

        if (signVisible) {

          const image =
            new Image();


          image.onload =
            function () {

              drawSignAndSave(
                canvas,
                ctx,
                image
              );

            };


          image.src =
            sign.src;


        } else {

          saveCanvas(canvas);

        }

      }
    );


    /* ========================================
       看板をCanvasへ描画
       ======================================== */

    function drawSignAndSave(
      canvas,
      ctx,
      image
    ) {


      /*
       * 画面座標とCanvas座標の比率
       */

      const scaleX =
        canvas.width /
        window.innerWidth;


      const scaleY =
        canvas.height /
        window.innerHeight;


      let drawX =
        signX *
        scaleX;


      let drawY =
        signY *
        scaleY;


      /*
       * 内側カメラ
       *
       * 背景が左右反転しているので
       * 看板の位置だけ左右反転
       */

      if (
        cameraFacing === "user"
      ) {

        drawX =
          canvas.width -
          drawX;

      }


      /* ====================================
         看板サイズ
         ==================================== */

      const displayedWidth =
        sign.offsetWidth *
        signScale;


      const displayedHeight =
        sign.offsetHeight *
        signScale;


      const drawWidth =
        displayedWidth *
        scaleX;


      const drawHeight =
        displayedHeight *
        scaleY;


      /* ====================================
         左上
         ==================================== */

      const x =
        drawX -
        drawWidth / 2;


      const y =
        drawY -
        drawHeight / 2;


      /* ====================================
         PNG描画
         ==================================== */

      ctx.drawImage(

        image,

        x,
        y,

        drawWidth,
        drawHeight

      );


      /* ====================================
         保存
         ==================================== */

      saveCanvas(canvas);

    }


    /* ========================================
       保存
       ======================================== */

    function saveCanvas(canvas) {


      /*
       * 日時
       */

      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");


      const day =
        String(
          now.getDate()
        ).padStart(2, "0");


      const hour =
        String(
          now.getHours()
        ).padStart(2, "0");


      const minute =
        String(
          now.getMinutes()
        ).padStart(2, "0");


      const second =
        String(
          now.getSeconds()
        ).padStart(2, "0");


      /*
       * ファイル名
       */

      const fileName =
        `seirei-graduation-ar-${year}${month}${day}-${hour}${minute}${second}.png`;


      /* ====================================
         PNG
         ==================================== */

      canvas.toBlob(

        function (blob) {


          if (!blob) {

            alert(
              "写真の作成に失敗しました。"
            );

            return;

          }


          /*
           * 一時URL
           */

          const url =
            URL.createObjectURL(
              blob
            );


          /*
           * ダウンロード
           */

          const link =
            document.createElement(
              "a"
            );


          link.href =
            url;


          link.download =
            fileName;


          document.body.appendChild(
            link
          );


          link.click();


          document.body.removeChild(
            link
          );


          /*
           * URL解放
           */

          setTimeout(
            function () {

              URL.revokeObjectURL(
                url
              );

            },
            1000
          );


        },

        "image/png"

      );

    }


    /* ========================================
       画面サイズ変更
       ======================================== */

    window.addEventListener(
      "resize",
      function () {


        if (
          signX >
          window.innerWidth
        ) {

          signX =
            window.innerWidth / 2;

        }


        if (
          signY >
          window.innerHeight
        ) {

          signY =
            window.innerHeight / 2;

        }


        updateSign();

      }
    );


    /* ========================================
       起動
       ======================================== */

    startCamera();


  </script>
